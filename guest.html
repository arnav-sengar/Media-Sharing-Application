<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PhotoLelo — Find My Photos</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <span class="logo">PhotoLelo</span>
  </nav>

  <!-- SCAN SCREEN -->
  <div id="scan-screen" class="guest-container">
    <div class="guest-card">
      <h2>Find your photos</h2>
      <p>Allow camera access and click scan. We'll find every photo you're in.</p>

      <div class="video-wrapper">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>

      <button id="scan-btn" onclick="startScan()">Scan my face</button>
      <p id="scan-status" class="scan-status"></p>
    </div>
  </div>

  <!-- RESULTS SCREEN (hidden until scan is done) -->
  <div id="results-screen" class="hidden">
    <nav class="navbar">
      <span class="logo">PhotoLelo</span>
      <button onclick="rescan()">Scan again</button>
    </nav>
    <div class="admin-content">
      <div class="card">
        <h2>Your Photos</h2>
        <p id="results-count">Looking through the event photos...</p>
        <div id="results-grid" class="results-grid"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <script src="js/guest.js"></script>
</body>
</html>
